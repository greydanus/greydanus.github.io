<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criteria Converter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container-fluid {
            height: 100vh;
            padding-top: 1rem;
            padding-bottom: 1rem;
        }
        .row {
            height: 100%;
        }
        #jsonInput {
            resize: none;
            font-family: monospace;
            font-size: 0.7rem;
        }
        .table-container {
            height: calc(100% - 40px);
            overflow-y: auto;
            background-color: white;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
        }
        .table th {
            position: sticky;
            top: 0;
            background-color: #f1f3f5;
        }
        .table {
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .supporting-quote {
            font-style: italic;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <div class="container-fluid">
        <div class="row gx-4">
            <div class="col-md-4 d-flex flex-column h-100">
                <h5 class="mb-2">Paste JSON Criteria Here</h5>
                <textarea id="jsonInput" class="form-control flex-grow-1" placeholder="Paste your JSON here..."></textarea>
            </div>
            <div class="col-md-8 d-flex flex-column h-100">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5 class="mb-0">Human-Readable Format</h5>
                    <div class="buttons">
                        <button id="copyButton" class="btn btn-success btn-sm d-none">Copy for Google Docs</button>
                        <button id="copyCsvButton" class="btn btn-primary btn-sm d-none">Copy as CSV</button>
                    </div>
                </div>
                <div id="tableContainer" class="table-container">
                    <div class="p-3 text-muted">A table will be rendered here.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const jsonInput = document.getElementById('jsonInput');
        const tableContainer = document.getElementById('tableContainer');
        const copyButton = document.getElementById('copyButton');
        const copyCsvButton = document.getElementById('copyCsvButton');

        let currentQuestions = [];
        let fullJsonData = null;

        jsonInput.addEventListener('input', handleInputChange);
        copyButton.addEventListener('click', handleCopyClick);
        copyCsvButton.addEventListener('click', handleCsvCopyClick);

        function handleInputChange() {
            const rawText = jsonInput.value.trim();
            tableContainer.innerHTML = '<div class="p-3 text-muted">A table will be rendered here.</div>';
            copyButton.classList.add('d-none');
            copyCsvButton.classList.add('d-none');
            currentQuestions = [];

            if (!rawText) return;

            try {
                fullJsonData = JSON.parse(rawText);
            } catch (error) {
                tableContainer.innerHTML = `<div class="p-3 text-danger">Invalid JSON: ${error.message}</div>`;
                return;
            }

            const questions = findQuestionsArray(fullJsonData);

            if (questions && Array.isArray(questions)) {
                currentQuestions = questions;
                renderTable(questions);
                copyButton.classList.remove('d-none');
                copyCsvButton.classList.remove('d-none');
            } else {
                tableContainer.innerHTML = '<div class="p-3 text-warning">Could not find a valid questions array in the JSON.</div>';
            }
        }

        function findQuestionsArray(data) {
            if (Array.isArray(data)) return data;
            if (data?.guideline?.questions) return data.guideline.questions;
            if (data?.questions) return data.questions;
            return null;
        }
        
        function handleCopyClick() {
            if (currentQuestions.length === 0) return;
            const tableHtmlForCopy = generateTableHtml(currentQuestions, true);
            const blob = new Blob([tableHtmlForCopy], { type: 'text/html' });
            const item = new ClipboardItem({ 'text/html': blob });

            navigator.clipboard.write([item]).then(() => {
                const originalText = copyButton.textContent;
                copyButton.textContent = 'Copied!';
                setTimeout(() => { copyButton.textContent = originalText; }, 2000);
            });
        }

        function handleCsvCopyClick() {
            if (currentQuestions.length === 0) return;
            const csvContent = generateCsvContent(currentQuestions);
            navigator.clipboard.writeText(csvContent).then(() => {
                const originalText = copyCsvButton.textContent;
                copyCsvButton.textContent = 'Copied!';
                setTimeout(() => { copyCsvButton.textContent = originalText; }, 2000);
            });
        }

        function formatOutcome(condition) {
            if (!condition) return 'N/A';
            switch (condition.outcome) {
                case 'approve': return 'Approve';
                case 'deny': return 'Deny';
                case 'next_question':
                    if (condition.next_question_index === 998) return 'Approve';
                    if (condition.next_question_index === 999) return 'Deny';
                    return `Go to Q${condition.next_question_index + 1}`;
                default: return 'N/A';
            }
        }

        function generateTableHtml(questions, useInlineStyles) {
            const cellBorderStyle = 'border: 1pt solid black; padding: 0.5rem;';
            const tableStyle = useInlineStyles ? 'style="border-collapse: collapse; width: 100%;"' : '';
            const tableClasses = useInlineStyles ? '' : 'class="table table-striped table-hover mb-0"';

            let tableHtml = `<table ${tableClasses} ${tableStyle}>
                <thead ${useInlineStyles ? 'style="background-color: #f1f3f5;"' : 'class="table-light"'}>
                    <tr>
                        <th style="width: 5%; ${cellBorderStyle}">Q#</th>
                        <th style="${cellBorderStyle}">Question</th>
                        <th style="${cellBorderStyle}">Supporting Quote</th>
                        <th style="width: 7.5%; ${cellBorderStyle}">If Yes</th>
                        <th style="width: 7.5%; ${cellBorderStyle}">If No</th>
                    </tr>
                </thead>
                <tbody>`;

            questions.forEach((q, index) => {
                const yesCondition = q.conditions.find(c => c.value === 'yes');
                const noCondition = q.conditions.find(c => c.value === 'no');
                const yesOutcome = formatOutcome(yesCondition);
                const noOutcome = formatOutcome(noCondition);
                const supportingQuote = q.supporting_quote || '';
                const stripeStyle = useInlineStyles && index % 2 !== 0 ? 'background-color: #f8f9fa;' : '';
                const editableAttr = useInlineStyles ? '' : 'contenteditable="true"';

                tableHtml += `
                    <tr>
                        <td style="${cellBorderStyle} ${stripeStyle}">Q${q.index + 1}</td>
                        <td ${editableAttr} data-q-index="${index}" data-field="question_text" style="${cellBorderStyle} ${stripeStyle}">${q.question_text}</td>
                        <td ${editableAttr} data-q-index="${index}" data-field="supporting_quote" class="supporting-quote" style="${cellBorderStyle} ${stripeStyle} font-style: italic;">${supportingQuote}</td>
                        <td ${editableAttr} data-q-index="${index}" data-field="if_yes" style="${cellBorderStyle} ${stripeStyle}">${yesOutcome}</td>
                        <td ${editableAttr} data-q-index="${index}" data-field="if_no" style="${cellBorderStyle} ${stripeStyle}">${noOutcome}</td>
                    </tr>`;
            });

            tableHtml += `</tbody></table>`;
            return tableHtml;
        }

        function renderTable(questions) {
            tableContainer.innerHTML = generateTableHtml(questions, false);
            tableContainer.querySelectorAll('td[contenteditable]').forEach(cell => {
                cell.addEventListener('blur', e => {
                    const qIndex = parseInt(e.target.dataset.qIndex);
                    const field = e.target.dataset.field;
                    const newValue = e.target.textContent.trim();

                    if (field === 'question_text') {
                        currentQuestions[qIndex].question_text = newValue;
                    } else if (field === 'supporting_quote') {
                        if (newValue) currentQuestions[qIndex].supporting_quote = newValue;
                        else delete currentQuestions[qIndex].supporting_quote;
                    } else {
                        const condValue = field === 'if_yes' ? 'yes' : 'no';
                        const cond = currentQuestions[qIndex].conditions.find(c => c.value === condValue);
                        if (newValue === 'Approve') cond.outcome = 'approve';
                        else if (newValue === 'Deny') cond.outcome = 'deny';
                        else if (newValue.startsWith('Go to Q')) {
                            cond.outcome = 'next_question';
                            cond.next_question_index = parseInt(newValue.match(/\d+/)[0]) - 1;
                        }
                    }

                    jsonInput.removeEventListener('input', handleInputChange);
                    jsonInput.value = JSON.stringify(fullJsonData, null, 2);
                    jsonInput.addEventListener('input', handleInputChange);
                });
                cell.addEventListener('keydown', e => {
                    if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
                });
            });
        }

        function generateCsvContent(questions) {
            const headers = ['Q#', 'Question', 'If Yes', 'If No'];
            const rows = questions.map(q => {
                const yesCondition = q.conditions.find(c => c.value === 'yes');
                const noCondition = q.conditions.find(c => c.value === 'no');
                return [`Q${q.index + 1}`, q.question_text, formatOutcome(yesCondition), formatOutcome(noCondition)];
            });
            const escapeCsvField = (field) => `"${String(field || '').replace(/"/g, '""')}"`;
            let csvContent = headers.map(escapeCsvField).join(',') + '\n';
            rows.forEach(row => { csvContent += row.map(escapeCsvField).join(',') + '\n'; });
            return csvContent;
        }
    </script>
</body>
</html>
